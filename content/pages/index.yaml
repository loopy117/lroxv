titre: Accueil
statut: publie
seo:
  titre: La Roque Ovalie XV · Club de rugby à La Roque-d'Anthéron
  description: "Club de rugby de La Roque-d'Anthéron : baby rugby, école de rugby de 3 à 14 ans, moins de 16 ans à XV et rugby loisir au stade Michel Bouchard."
ancres:
  - école de rugby de La Roque-d'Anthéron
  - club de rugby de La Roque-d'Anthéron
# Les rencontres (calendrier, résultats) passeront sur le bloc match-center quand il existera.
sections:
  - block: hero
    variant: split
    background: sombre
    surtitre: Club de rugby · La Roque-d'Anthéron
    titre: Le rugby pour tous, de 3 ans aux… beaucoup plus !
    texte: "École de rugby, moins de 16 ans à XV et rugby loisir : toutes nos séances ont lieu au stade Michel Bouchard. Venez essayer, on vous attend sur le terrain."
    image:
      src: /img/accueil/ecole-de-rugby-course.jpg
      alt: Deux jeunes de l'école de rugby courent ballon en main pendant un entraînement
    ctas:
      - label: Inscrire mon enfant
        href: "#inscription"
        style: primaire
      - label: Voir les créneaux
        href: "#calendrier"
        style: secondaire
    points:
      - Baby rugby et école de rugby
      - Moins de 16 ans en championnat
      - Rugby loisir pour les adultes

  - block: planning
    id: equipes
    variant: categories
    background: alt
    surtitre: Nos équipes
    titre: Une place pour chaque âge
    intro: Choisissez la catégorie qui vous correspond pour voir sa page, ses créneaux et ses actualités.

  - block: planning
    id: calendrier
    variant: semaine
    surtitre: La semaine au stade
    titre: Les créneaux d'entraînement
    lieu: stade Michel Bouchard

  - block: texte-image
    id: actualites
    variant: image-droite
    background: alt
    surtitre: Actualités
    titre: L'école de rugby au tournoi du RCT
    contenu: "Vestiaire de pro, pelouse de stade et rencontre avec des joueurs toulonnais : une journée que nos jeunes ne sont pas près d'oublier."
    images:
      - src: /img/actualites/tournoi-rct-vestiaire.jpg
        alt: Les jeunes de l'école de rugby dans un vestiaire de stade, derrière la pancarte La Roque Ovalie XV

  - block: galerie
    id: galerie
    variant: mosaique
    surtitre: En images
    titre: La vie du club
    images:
      - src: /img/galerie/photo-equipe-poteaux.jpg
        alt: Photo d'équipe sous les poteaux du stade
      - src: /img/galerie/jeunes-joueurs-sourire.jpg
        alt: Quatre jeunes joueurs souriants au bord du terrain
      - src: /img/galerie/baby-rugby-tunnel.jpg
        alt: "Baby rugby : un enfant traverse un tunnel pendant un parcours"
      - src: /img/galerie/touche.jpg
        alt: Un joueur soulevé en touche pendant une rencontre
      - src: /img/galerie/porteur-de-ballon.jpg
        alt: Un joueur porte le ballon face à la défense adverse
      - src: /img/galerie/plaquage-ecole.jpg
        alt: Des jeunes de l'école de rugby jouent un ballon pendant un plateau

  - block: partenaires
    id: partenaires
    background: sombre
    surtitre: Ils soutiennent le club
    titre: Nos partenaires
    intro: Merci aux entreprises qui font vivre le rugby à La Roque-d'Anthéron.

  - block: formulaire
    id: inscription
    variant: carte
    background: accent
    surtitre: Saison 2026-2027
    titre: Rejoindre le club
    intro: "Laissez-nous vos coordonnées : un éducateur vous recontacte pour une séance d'essai et les papiers de licence."
    formulaire: inscription
    sujet: Demande d'inscription
    bouton: Envoyer ma demande

  - block: texte
    id: infos
    variant: etroit
    surtitre: Infos pratiques
    titre: Stade Michel Bouchard
    contenu: |
      Stade Michel Bouchard, 13640 La Roque-d'Anthéron ([voir l'itinéraire](https://www.google.com/maps/search/?api=1&query=Stade%20Michel%20Bouchard%2C%2013640%20La%20Roque-d%27Anth%C3%A9ron)).

      Toutes les séances ont lieu au stade. Pour une question, écrivez-nous avec le formulaire ci-dessus ou retrouvez le club sur [sa page Facebook](https://www.facebook.com/lroxv).
